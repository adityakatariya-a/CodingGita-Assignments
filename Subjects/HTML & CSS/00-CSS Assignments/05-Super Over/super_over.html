<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Super Over Scoreboard</title>
  <link rel="stylesheet" href="super_over.css">
</head>
<body>
  <div class="stadium">

    <div class="logo">
      <div class="logo-text">SUPER<br>OVER</div>
    </div>

    <div class="teams">
      <div class="team ind">
        <h1>IND</h1>
        <div class="balls">
          <span class="ball">4</span>
          <span class="ball">3</span>
          <span class="ball">2</span>
          <span class="ball">6</span>
          <span class="ball">6</span>
          <span class="ball">6</span>
        </div>
        <div class="score">27/0</div>
      </div>

      <div class="team pak">
        <h1>PAK</h1>
        <div class="balls">
          <span class="ball">2</span>
          <span class="ball">4</span>
          <span class="ball">0</span>
          <span class="ball">3</span>
          <span class="ball">1</span>
          <span class="ball">4</span>
        </div>
        <div class="score">14/0</div>
      </div>
    </div>

    <div class="actions">
      <button class="btn bat" aria-label="Start">
        <span class="bat-icon"></span>
      </button>
      <button class="btn reset" aria-label="Reset">
        <span class="reset-icon">&#8635;</span>
      </button>
    </div>

  </div>
</body>
</html>
