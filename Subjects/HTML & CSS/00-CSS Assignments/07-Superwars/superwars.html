<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hero Score Board</title>
  <link rel="stylesheet" href="superwars.css">
</head>
<body>
  <div class="board">
    <div class="row">

      <div class="group">
        <div class="card">
          <img src="assets/spider-man.png" alt="Spiderman">
          <div class="name">Spiderman</div>
          <div class="score">12</div>
        </div>

        <div class="card">
          <img src="assets/wonder-women.png" alt="Wonder Women">
          <div class="name">Wonder<br>Women</div>
          <div class="score">30</div>
        </div>
      </div>

      <div class="match-score">5 - 0</div>

      <div class="group">
        <div class="card">
          <img src="assets/captain-america.png" alt="Captain America">
          <div class="name">Captain<br>America</div>
          <div class="score">50</div>
        </div>

        <div class="card">
          <img src="assets/gem-woman.png" alt="Gem Woman">
          <div class="name">Gem Woman</div>
          <div class="score">12</div>
        </div>
      </div>

    </div>
  </div>
</body>
</html>
