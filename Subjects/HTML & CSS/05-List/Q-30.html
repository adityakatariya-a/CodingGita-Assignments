<!DOCTYPE html>
<html>
<head>
    <title>Complete List Example</title>
</head>
<body>

    <h2>Programming Languages</h2>

    <ul type="square">
        <li>
            Frontend
            <ol>
                <li>HTML</li>
                <li>CSS</li>
                <li>JavaScript</li>
            </ol>
        </li>

        <li>Backend</li>
    </ul>

    <h2>Project Stages</h2>

    <ol type="A" start="5" reversed>
        <li>Testing</li>
        <li>Development</li>
        <li>Planning</li>
    </ol>

    <h2>Technical Terms</h2>

    <dl>
        <dt>HTML</dt>
        <dd>Used to create the structure of a web page.</dd>

        <dt>CSS</dt>
        <dd>Used to style and design web pages.</dd>
    </dl>

</body>
</html>
