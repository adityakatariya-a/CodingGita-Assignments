<!DOCTYPE html>
<html>
<head>
    <title>HTML List Elements</title>
</head>
<body>

    <h2>HTML List Elements</h2>

    <dl>
        <dt>Unordered List</dt>
        <dd>Used to display items with bullets using the &lt;ul&gt; tag.</dd>

        <dt>Ordered List</dt>
        <dd>Used to display items with numbers or letters using the &lt;ol&gt; tag.</dd>

        <dt>Description List</dt>
        <dd>Used to show terms and their descriptions using &lt;dl&gt;, &lt;dt&gt;, and &lt;dd&gt; tags.</dd>
    </dl>

</body>
</html>
