<!DOCTYPE html>
<html>
<head>
    <title>Advanced Table</title>
</head>
<body>

    <table border="1">

        <caption>Student Course Summary</caption>

        <thead>
            <tr>
                <th scope="col">Student</th>
                <th scope="col">Course</th>
                <th scope="col">Duration</th>
            </tr>
        </thead>

        <tbody>
            <tr>
                <th scope="row" rowspan="2">Aditya</th>
                <td>HTML</td>
                <td>1 Month</td>
            </tr>

            <tr>
                <td colspan="2">CSS and JavaScript</td>
            </tr>

            <tr>
                <th scope="row">Rahul</th>
                <td>Data Analytics</td>
                <td>5 Months</td>
            </tr>
        </tbody>

        <tfoot>
            <tr>
                <td colspan="3">End of Student Course Summary</td>
            </tr>
        </tfoot>

    </table>

</body>
</html>
