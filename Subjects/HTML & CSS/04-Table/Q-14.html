<!DOCTYPE html>
<html>
<head>
    <title>Scope and Headers Table</title>
</head>
<body>

    <table border="1">

        <tr>
            <th id="student" scope="col">Student</th>
            <th id="course" scope="col">Course</th>
            <th id="marks" scope="col">Marks</th>
        </tr>

        <tr>
            <th id="aditya" scope="row">Aditya</th>
            <td headers="course aditya">Web Development</td>
            <td headers="marks aditya">90</td>
        </tr>

        <tr>
            <th id="rahul" scope="row">Rahul</th>
            <td headers="course rahul">Data Analytics</td>
            <td headers="marks rahul">85</td>
        </tr>

    </table>

</body>
</html>
