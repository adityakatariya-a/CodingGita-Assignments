<!DOCTYPE html>
<html>
<head>
    <title>Rowspan Table</title>
</head>
<body>

    <table border="1">

        <tr>
            <th>Track</th>
            <th>Semester</th>
        </tr>

        <tr>
            <td rowspan="2">Programming Track</td>
            <td>Semester 1</td>
        </tr>

        <tr>
            <td>Semester 2</td>
        </tr>

    </table>

</body>
</html>
