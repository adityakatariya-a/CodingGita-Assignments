<!DOCTYPE html>
<html>
<head>
    <title>Complete Table</title>
</head>
<body>

    <table border="1">

        <caption>Student Course Report</caption>

        <thead>
            <tr>
                <th scope="col">Student</th>
                <th scope="col">Course</th>
                <th scope="col">Duration</th>
            </tr>
        </thead>

        <tbody>
            <tr>
                <th scope="row">Aditya</th>
                <td>Web Development</td>
                <td>4 Months</td>
            </tr>

            <tr>
                <th scope="row">Rahul</th>
                <td colspan="2">Data Analytics - 5 Months</td>
            </tr>
        </tbody>

        <tfoot>
            <tr>
                <td colspan="3">End of Student Report</td>
            </tr>
        </tfoot>

    </table>

</body>
</html>
